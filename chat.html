<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confeita - Chef IA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Fredoka:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" href="./assets/logo-exact.png" />
    <link rel="stylesheet" href="./theme.css" />
    <script defer src="./app.js"></script>
  </head>
  <body data-page="chat">
      <header class="topbar topbar-home" data-home-header>
        <div class="topbar-inner topbar-inner-home">
          <a class="brand" href="./confeita-identidade.html">
            <img class="brand-mark" src="./assets/logo-exact.png" alt="Confeita" />
          </a>
          <nav class="nav-links nav-links-main" aria-label="Principal">
            <a data-nav href="./receita.html">Receitas</a>
            <a data-nav href="./comunidade.html">Comunidade</a>
          </nav>
          <div class="category-picker nav-categories" data-category-picker>
            <button class="filter-chip category-trigger" type="button" data-categories-toggle aria-expanded="false" aria-controls="chat-category-menu">
              <span>Categorias</span>
              <span class="category-caret" aria-hidden="true">▾</span>
            </button>
            <div class="category-menu" id="chat-category-menu" data-categories-menu hidden>
              <button class="category-option active" type="button" data-recipe-filter="all">Todas</button>
              <button class="category-option" type="button" data-recipe-filter="bolos">Bolos</button>
              <button class="category-option" type="button" data-recipe-filter="cupcakes">Cupcakes</button>
              <button class="category-option" type="button" data-recipe-filter="tortas">Tortas</button>
              <button class="category-option" type="button" data-recipe-filter="paes">Pães</button>
              <button class="category-option" type="button" data-recipe-filter="mousses">Mousses</button>
              <button class="category-option" type="button" data-recipe-filter="macarons">Macarons</button>
              <button class="category-option" type="button" data-recipe-filter="sobremesas">Sobremesas</button>
            </div>
          </div>
          <div class="header-actions">
            <a class="btn btn-secondary header-login" href="./login.html">Entrar</a>
            <a class="nav-cta header-cta" href="./receita.html">Começar grátis</a>
            <button class="header-menu-toggle" type="button" data-header-menu-toggle aria-expanded="false" aria-controls="chat-header-drawer" aria-label="Abrir menu">
              <span class="sr-only">Abrir menu</span>
              <span></span>
              <span></span>
              <span></span>
            </button>
          </div>
        </div>
        <div class="header-drawer" id="chat-header-drawer" data-header-drawer hidden>
          <nav class="header-drawer-links" aria-label="Principal">
            <a data-nav href="./receita.html">Receitas</a>
            <a data-nav href="./comunidade.html">Comunidade</a>
          </nav>
          <div class="header-drawer-categories" data-category-picker>
            <button class="filter-chip category-trigger" type="button" data-categories-toggle aria-expanded="false" aria-controls="chat-category-menu-drawer">
              <span>Categorias</span>
              <span class="category-caret" aria-hidden="true">▾</span>
            </button>
            <div class="category-menu category-menu-drawer" id="chat-category-menu-drawer" data-categories-menu hidden>
              <button class="category-option active" type="button" data-recipe-filter="all">Todas</button>
              <button class="category-option" type="button" data-recipe-filter="bolos">Bolos</button>
              <button class="category-option" type="button" data-recipe-filter="cupcakes">Cupcakes</button>
              <button class="category-option" type="button" data-recipe-filter="tortas">Tortas</button>
              <button class="category-option" type="button" data-recipe-filter="paes">Pães</button>
              <button class="category-option" type="button" data-recipe-filter="mousses">Mousses</button>
              <button class="category-option" type="button" data-recipe-filter="macarons">Macarons</button>
              <button class="category-option" type="button" data-recipe-filter="sobremesas">Sobremesas</button>
            </div>
          </div>
          <div class="header-drawer-actions">
            <a class="btn btn-secondary header-login" href="./login.html">Entrar</a>
            <a class="nav-cta header-cta" href="./receita.html">Começar grátis</a>
          </div>
        </div>
      </header>

    <main class="chat-page-main">
      <section class="chat-board" data-chat-stream>
        <div class="chat-line">
          <div class="chat-header-avatar">CI</div>
          <div class="chat-bubble">Olá! Sou o Chef IA da Confeita! 👋 Sobre o que posso te ajudar hoje?</div>
        </div>

        <div class="chat-pills">
          <button class="pill" data-prompt="Como fazer ganache brilhante?">Como fazer ganache brilhante?</button>
          <button class="pill" data-prompt="Meu bolo afundou, o que fazer?">Meu bolo afundou, o que fazer?</button>
          <button class="pill" data-prompt="Posso trocar manteiga por óleo?">Posso trocar manteiga por óleo?</button>
          <button class="pill" data-prompt="Segredo do chantilly firme">Segredo do chantilly firme</button>
          <button class="pill" data-prompt="Como evitar macaron rachado?">Como evitar macaron rachado?</button>
        </div>
      </section>
    </main>

    <div class="chat-input-bar">
      <input data-chat-input type="text" placeholder="Pergunte ao Chef IA..." />
      <button class="chat-mic" type="button">🎤</button>
      <button class="chat-send" data-chat-send type="button">➤</button>
    </div>
  </body>
</html>
